# Render 用の設定(Blueprint)
# Render のダッシュボードで New > Blueprint からこのリポジトリを選ぶと、この内容でサービスが作られる
services:
  - type: web
    name: stamp-rally
    runtime: docker
    plan: free
    # 日本から一番近いリージョン
    region: singapore
    healthCheckPath: /api/spots
    envVars:
      - key: COOKIE_SECURE
        value: "true"
